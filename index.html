<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Outpost Privacy Policy has moved</title>
<!--
  This page has moved to https://www.outpostbars.app/privacy/

  WHY A META REFRESH AND NOT A 301. GitHub Pages is static hosting with no
  redirect rules and no control over response headers, so a real 301 is not
  available here. The <link rel="canonical"> below is the important half: it
  tells search engines the new URL is authoritative even though the redirect
  is client-side, which stops two copies of the same document competing.

  WHY THIS URL IS NOT SIMPLY DELETED. Shipped iOS and Android builds link to
  this address from their Settings screens, and an App Store listing's
  privacy-policy field may point here too. Those binaries are already in
  users' hands and cannot be changed retroactively, so this URL has to keep
  resolving. A privacy policy URL that 404s is a store-compliance problem,
  not just a broken link.

  The previous text of this document remains in this repository's git
  history.
-->
<meta http-equiv="refresh" content="0; url=https://www.outpostbars.app/privacy/">
<link rel="canonical" href="https://www.outpostbars.app/privacy/">
<meta name="robots" content="noindex, follow">
<style>
  body { font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         max-width: 32rem; margin: 0 auto; padding: 4rem 1.25rem; }
  a { color: #1a56db; }
</style>
</head>
<body>
  <h1>This page has moved</h1>
  <p>
    The Outpost Privacy Policy is now published at
    <a href="https://www.outpostbars.app/privacy/">www.outpostbars.app/privacy/</a>.
  </p>
  <p>You should be redirected automatically. If not, follow the link above.</p>
</body>
</html>
